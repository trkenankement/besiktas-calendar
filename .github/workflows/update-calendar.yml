name: Update calendars

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # her gün 06:17 (Türkiye saati)
  workflow_dispatch:

permissions:
  contents: read

# Aynı anda tek çalışma: yarım kalmış bir yayın başka bir çalışmayla çakışmasın.
concurrency:
  group: update-calendar
  cancel-in-progress: false

# Eylemler tam commit numarasına sabitlidir (sürüm yorumda). Güncellemek için yeni sürümün
# commit numarasını bulup buradaki numarayı ve yorumu değiştirin.
jobs:
  build:
    # ubuntu-latest 19 Ekim 2026'da Ubuntu 26'ya geçecek; günlük iş doğrulanmış imajda kalsın.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # docs/ değişirse commit atmak için

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Token diskte kalmasın: paket kurulumu, testler ve üretici kod onu göremesin.
          # Yalnızca aşağıdaki "Commit changes" adımına açıkça verilir.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      # Kaynaklardan biri hata verirse bu adım başarısız olur; böylece eksik veri yayınlanmaz
      # ve bir önceki sağlam site yayında kalır.
      - name: Update calendars
        run: python -m besiktas_calendar

      - name: Commit changes
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          set -euo pipefail
          # Otomatik commit'ler depo sahibinin (noreply) kimliğiyle atılır.
          git config user.name "$OWNER"
          git config user.email "${OWNER_ID}+${OWNER}@users.noreply.github.com"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          push() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin HEAD:main; }
          git add docs
          if git diff --cached --quiet; then
            echo "Takvimlerde değişiklik yok; commit atılmadı."
            # GitHub, 60 gün etkinlik olmayan depolarda zamanlanmış çalışmaları kapatır.
            # Son commit 45 günden eskiyse çalışmanın devam etmesi için boş bir commit at.
            last_commit=$(git log -1 --format=%ct)
            if [ $(( $(date +%s) - last_commit )) -gt $(( 45 * 24 * 3600 )) ]; then
              git commit --allow-empty -m "chore: keep scheduled workflow active"
              push || { git pull --rebase origin main && push; }
            fi
          else
            git commit -m "chore: update calendars"
            push || { git pull --rebase origin main && push; }
          fi

      - name: Upload site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write # Pages'e yayınlamak için
      id-token: write # yayının doğru kaynaktan geldiğini doğrulamak için
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
