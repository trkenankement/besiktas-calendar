[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "besiktas-calendar"
version = "1.0.0"
description = "Beşiktaş erkek futbol ve basketbol maçlarını ICS takvim akışlarına dönüştürür."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "icalendar>=6",
    "pyyaml>=6",
]
lint = [
    "ruff>=0.6",
    "bandit>=1.7",
]

[project.urls]
Homepage = "https://trkenankement.github.io/besiktas-calendar/"
Repository = "https://github.com/trkenankement/besiktas-calendar"

[project.scripts]
club-calendar = "club_calendar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "C4"]
ignore = ["E501"]  # uzun satırlar (ör. Türkçe metinler) sorun değil

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607"]  # testlerde assert ve güvenilir argümanlarla git/bash çağrıları kullanılır

[tool.bandit]
exclude_dirs = ["tests"]
